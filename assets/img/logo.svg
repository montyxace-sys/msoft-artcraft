<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="MSoft">
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F38020"/>
      <stop offset="1" stop-color="#ff5a5a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- dark core -->
  <polygon points="60,8 106,32 106,88 60,112 14,88 14,32" fill="#0a0c16" stroke="#1e335d" stroke-width="2"/>

  <!-- speed slash -->
  <path d="M12 104 L108 16" stroke="url(#a)" stroke-width="8" stroke-linecap="square" filter="url(#glow)"/>
  <path d="M14 106 L110 18" stroke="rgba(255,255,255,.18)" stroke-width="2" stroke-linecap="square"/>

  <!-- M letter -->
  <path d="M28 90 L28 40 L48 62 L72 40 L72 90" fill="none" stroke="#f8a35d" stroke-width="8" stroke-linejoin="miter"/>
  <!-- spark -->
  <path d="M76 30 L98 30" stroke="#F38020" stroke-width="5" stroke-linecap="square"/>
</svg>
