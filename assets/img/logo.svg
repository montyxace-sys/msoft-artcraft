<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="MSoft">
  <defs>
    <linearGradient id="msg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F38020"/>
      <stop offset="1" stop-color="#ff3c62"/>
    </linearGradient>
    <linearGradient id="msd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1020"/>
      <stop offset="1" stop-color="#18213b"/>
    </linearGradient>
    <filter id="msglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- dark octagon -->
  <path d="M38 8 L82 8 L108 34 L108 86 L82 112 L38 112 L12 86 L12 34 Z"
        fill="url(#msd)" stroke="#1e335d" stroke-width="2"/>

  <!-- brand cut -->
  <path d="M24 104 L104 18" stroke="url(#msg)" stroke-width="10" stroke-linecap="square" filter="url(#msglow)"/>
  <path d="M22 106 L88 28" stroke="rgba(255,255,255,.16)" stroke-width="2" stroke-linecap="square"/>

  <!-- bold monogram -->
  <text x="58" y="74" text-anchor="middle"
        font-family="Inter,Arial,sans-serif" font-size="54" font-weight="900"
        letter-spacing="-3" fill="#F38020" opacity="1">MS</text>

  <!-- corner spark -->
  <path d="M93 28 L106 28 M99.5 21.5 L99.5 34.5" stroke="#F38020" stroke-width="4" stroke-linecap="square"/>
</svg>
